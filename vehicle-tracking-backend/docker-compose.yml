version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vehicle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vehicle_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: vehicle_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vehicle_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/vehicle_tracker
      SECRET_KEY: supersecretjwtkeyforvehicletrackingassessment2026!
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_TOPIC: "vehicles/+/gps"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  gps_simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vehicle_gps_simulator
    restart: unless-stopped
    command: ["python", "-m", "gps_simulator.simulator"]
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      SIMULATION_INTERVAL: "3.0"
    depends_on:
      - mosquitto
      - backend

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
